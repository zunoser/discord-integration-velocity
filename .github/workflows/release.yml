name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    timeout-minutes: 360
    permissions:
      contents: write
    name: Prepare release
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))

    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      sha: ${{ steps.bump.outputs.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Bump patch version
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(sed -n 's/^[[:space:]]*version = "\(.*\)".*/\1/p' build.gradle.kts | head -n 1)"
          if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must be semantic x.y.z, got: $current" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current"
          next="${major}.${minor}.$((patch + 1))"
          perl -0pi -e "s/version = \"\\Q$current\\E\"/version = \"$next\"/" build.gradle.kts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "chore: release v${next} [skip ci]"
          gh auth setup-git
          git push

          {
            echo "version=${next}"
            echo "tag=v${next}"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

  build:
    permissions:
      contents: read
    name: Build every supported version
    needs: prepare
    uses: $/.github/workflows/build.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}

  release:
    timeout-minutes: 360
    permissions:
      contents: write
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          gh release create "$RELEASE_TAG" \
            release-artifacts/*.jar \
            --target "$RELEASE_SHA" \
            --title "Discord Integration Velocity $RELEASE_VERSION" \
            --notes "Velocity plugin and version-specific Fabric backend jars. Install only the Fabric jar matching your Minecraft server version. Built from $RELEASE_SHA."
